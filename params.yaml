TRAINING:
  test_size: 0.2
  random_state: 42

  development:
    n_jobs: 4
    cv: 3

  production:
    n_jobs: 2
    cv: 5


BAYESIAN_OPTIMIZATION:
  n_trials: 500
  direction: maximize
  scoring: r2


XGBOOST:
  n_estimators:
    low: 50
    high: 200

  max_depth:
    low: 2
    high: 7

  learning_rate:
    low: 0.01
    high: 0.1

  subsample:
    low: 0.6
    high: 0.9

  colsample_bytree:
    low: 0.6
    high: 0.9

  min_child_weight:
    low: 1
    high: 10

  reg_alpha:
    low: 0.0
    high: 1.0

  reg_lambda:
    low: 1
    high: 10
