artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_file: artifacts/data_ingestion/WineQT.csv
  database_table: wine_data
  kaggle_dataset: uciml/red-wine-quality-cortez-et-al-2009
  status_file: artifacts/data_ingestion/status.json

data_validation:
  root_dir: artifacts/data_validation
  source_file: artifacts/data_ingestion/WineQT.csv
  status_file: artifacts/data_validation/status.json

data_transformation:
  root_dir: artifacts/data_transformation
  source_file: artifacts/data_ingestion/WineQT.csv
  train_file: artifacts/data_transformation/train.csv
  test_file: artifacts/data_transformation/test.csv
  scaler_file: artifacts/data_transformation/scaler.joblib
  status_file: artifacts/data_transformation/status.json

model_trainer:
  root_dir: artifacts/model_trainer
  train_file: artifacts/data_transformation/train.csv
  test_file: artifacts/data_transformation/test.csv
  model_file: artifacts/model_trainer/model.joblib
  status_file: artifacts/model_trainer/status.json

model_evaluation:
  root_dir: artifacts/model_evaluation
  model_file: artifacts/model_trainer/model.joblib
  test_file: artifacts/data_transformation/test.csv
  scaler_file: artifacts/data_transformation/scaler.joblib
  metrics_file: artifacts/model_evaluation/metrics.json
  status_file: artifacts/model_evaluation/status.json

model_registry:
  root_dir: artifacts/model_registry
  model_file: artifacts/model_trainer/model.joblib
  scaler_file: artifacts/data_transformation/scaler.joblib
  test_file: artifacts/data_transformation/test.csv
  metrics_file: artifacts/model_evaluation/metrics.json
  model_name: WineQualityModel
  production_threshold: 0.45
  status_file: artifacts/model_registry/status.json
